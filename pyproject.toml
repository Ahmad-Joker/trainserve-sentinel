[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainserve-sentinel"
version = "0.1.0"
description = "Dependency-free batch train/serve data quality and drift CI gate"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
trainserve-sentinel = "trainserve_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
